# Weekly pull requests to update the GitHub Actions (their pinned commits),
# the submodules in thirdparty/ and the Docker base image (its pinned
# digest). CI tests them like any other pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    groups:
      submodules:
        patterns: ["*"]

  # The base image of the Dockerfile, pinned by digest
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
