# Weekly pull requests to update the GitHub Actions (their pinned commits),
# the crates and the Docker base image. CI tests them like any other pull
# request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ["*"]

  # The base image of the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
