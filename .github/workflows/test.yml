# make test on every push and pull request: builds the editor's test runner,
# the modules and the example package, and runs every canvas in examples/
# and tests/ against its .out (see tools/run_tests.c), and Make subgraph
# (tools/test_extract.c). Then all of it again built with AddressSanitizer
# and UBSan (make test-asan). The tests open a hidden window, so they run
# under Xvfb.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config liblua5.1-0-dev lua5.1 libfontconfig1-dev \
            libx11-dev zlib1g-dev zip xvfb xauth libgl1 libgl1-mesa-dri \
            libxrandr2 libxinerama1 libxcursor1 libxi6 fonts-dejavu-core

      - name: make test
        run: xvfb-run -a make test

      - name: make test-asan
        run: xvfb-run -a make test-asan
