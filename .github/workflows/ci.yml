name: CI

# Every push to main and every pull request: the format and clippy, the
# tests on Linux, macOS and Windows (every canvas in tests/ and examples/
# run, and compiled with cargo, against its .out), the release builds for
# each OS (archives, and an AppImage) and the Docker image. A push to main
# also refreshes the "nightly" release, and a v* tag makes a release of its
# own, only if every job passes. Their files are attested (signed as built
# by this workflow). The image goes to ghcr.io, as nightly or as the
# version and latest.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only: the jobs that publish ask for more
permissions:
  contents: read

# A new push to a pull request cancels the run that's testing the code it
# replaces. Pushes to main and tags never cancel anything.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # what winit and glow need to build on Linux (they load the rest at run time)
  APT_PACKAGES: libx11-dev libxkbcommon-dev libgl1-mesa-dev pkg-config

jobs:
  check:
    name: format and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  # Compiling every canvas builds programs with cargo: LINEIT_HOME keeps
  # their builds where the cache below finds them
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LINEIT_TEST_COMPILE: "1"
      LINEIT_HOME: ${{ github.workspace }}/.lineit-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - run: rustup update stable && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .lineit-home/cache/target
          key: test-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked
      # The CLI as a user runs it: an example, and a package made, packed,
      # installed and used
      - name: The CLI
        shell: bash
        run: |
          set -eux
          lineit=$GITHUB_WORKSPACE/target/debug/lineit
          "$lineit" --version
          "$lineit" run examples/hello.lua | tr -d '\r' | grep -x "Hello, world!"
          "$lineit" check examples/fizzbuzz.lua
          cd "$RUNNER_TEMP"
          "$lineit" new-package greet
          "$lineit" pack greet
          "$lineit" install greet-0.1.0.lipkg
          "$lineit" modules | grep greet/hello

  # What's released: an archive per OS and architecture, and the AppImage
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Ubuntu, for the oldest glibc it runs on
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    name: dist (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dist-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: bash scripts/dist.sh ${{ matrix.target }} ${{ matrix.archive }} dist
      - name: AppImage
        if: runner.os == 'Linux'
        run: bash scripts/appimage.sh target/${{ matrix.target }}/release/lineit dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t lineit .
      # It starts, serves the page, and runs a canvas
      - run: |
          docker run -d --name lineit -p 127.0.0.1:6080:6080 lineit
          for i in $(seq 30); do curl -fs http://127.0.0.1:6080/ >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:6080/vnc.html >/dev/null
          docker logs lineit
          docker run --rm --entrypoint lineit lineit run /usr/share/lineit/examples/hello.lua | grep -x "Hello, world!"

  # Every job the release needs passed
  ok:
    needs: [check, test, dist, docker]
    runs-on: ubuntu-24.04
    steps:
      - run: echo ok

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: ok
    # One at a time: nightly's files are replaced in place
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the release, and the nightly tag
      id-token: write # for the attestation
      attestations: write
    steps:
      # Its credentials stay: it pushes the nightly tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release is the version in Cargo.toml: its tag can't say something else
      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$version" ] ||
            { echo "the tag is $GITHUB_REF_NAME, the version in Cargo.toml is $version" >&2; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release

      - name: Checksums
        run: |
          cp scripts/install.sh release/
          cd release && sha256sum -- * >SHA256SUMS && cat SHA256SUMS

      # Proof that these files were built here, from this commit
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      # Nightly is the latest release: releases/latest, what install.sh and
      # the README's links get. A version's release isn't.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest=false
            exit
          fi
          notes="Built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC'). It changes with every push to main."
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create nightly release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title Nightly --notes "$notes" --latest=true
            exit
          fi
          # replaced in place, SHA256SUMS last: a download in between finds
          # files newer than their checksums, and fails instead of using them
          cd release
          files=()
          for f in *; do [ "$f" = SHA256SUMS ] || files+=("$f"); done
          gh release upload nightly "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload nightly SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
            while read -r asset; do
              [ -e "$asset" ] || gh release delete-asset nightly "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
          gh release edit nightly --repo "$GITHUB_REPOSITORY" --notes "$notes" --prerelease=false --latest=true

  # The image, to ghcr.io/OWNER/lineit: nightly from main, vX.Y.Z and latest
  # from a tag, once its release is made
  docker-publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: release
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            docker build -t "$image:$GITHUB_REF_NAME" -t "$image:latest" .
            docker push "$image:$GITHUB_REF_NAME"
            docker push "$image:latest"
          else
            docker build -t "$image:nightly" .
            docker push "$image:nightly"
          fi
