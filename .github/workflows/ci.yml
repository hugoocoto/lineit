name: CI

# Every push to main and every pull request runs the tests, with gcc and
# clang, with and without the sanitizers, checks the format, runs clang's
# static analyzer, builds the docs, and builds and checks what's released:
# the AppImage, the source tarball and the install script. A push to main
# also refreshes the "nightly" release with them, and a v* tag (see
# scripts/release.sh) makes a release of its own, only if every job passes.
# Their files are attested (signed as built by this workflow).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only: the job that publishes asks for more
permissions:
  contents: read

# A new push to a pull request cancels the run that's testing the code it
# replaces. Pushes to main and tags never cancel anything.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # What lineit builds with, and runs the tests with: they open a hidden
  # window, so under Xvfb
  APT_PACKAGES: >-
    build-essential pkg-config liblua5.1-0-dev lua5.1 libfontconfig1-dev
    libx11-dev zlib1g-dev libssl-dev zip clang xvfb xauth libgl1
    libgl1-mesa-dri libxrandr2 libxinerama1 libxcursor1 libxi6
    fonts-dejavu-core

jobs:
  # Every canvas in examples/ and tests/ against its .out, run and compiled,
  # and Make subgraph (make test), then all of it again with AddressSanitizer
  # and UBSan (make test-asan). WERROR=1: a new warning fails it.
  test:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      # The runners randomize addresses more than the sanitizers can handle
      - name: Make the sanitizers work
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build
        run: make CC=${{ matrix.cc }} WERROR=1

      - name: make test
        run: xvfb-run -a make test CC=${{ matrix.cc }} WERROR=1

      - name: make test-asan
        run: xvfb-run -a make test-asan CC=${{ matrix.cc }} WERROR=1

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version in the Makefile: others may format differently. pipx:
      # the system's Python takes no pip installs (PEP 668)
      - name: Install clang-format
        run: pipx install "clang-format==$(sed -n 's/^CLANG_FORMAT_VERSION := //p' Makefile)"

      - name: Check the format
        run: make check-format

      - name: Check the scripts
        run: shellcheck scripts/*.sh scripts/hooks/*

  # The paths no test runs: clang's static analyzer (see `make analyze`)
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Analyze
        run: make analyze

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: 0.15.1 # a new one could change the PDFs, or break them

      - name: Build PDFs
        run: make docs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-docs
          path: docs/**/*.pdf
          if-no-files-found: error

  package:
    # The oldest runner: an AppImage needs a glibc at least as new as the one
    # it was built with, so this makes it run on more systems
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1 # the runners have no FUSE
      # The raylib in the repo needs glibc 2.38: build it here, with this one
      # (see the Makefile). It needs the headers of the X11 extensions.
      RAYLIB: source
      RAYLIB_PACKAGES: libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES $RAYLIB_PACKAGES

      # The pinned AppImage tools and raylib's source (see the Makefile),
      # checked before every use whether they come from here or from the download
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('Makefile') }}
          restore-keys: downloads-

      - name: Build
        run: make appimage dist WERROR=1

      # What gets released works, before it's released
      - name: Check the AppImage
        run: |
          version=$(make -s version)
          [ "$(./lineit-x86_64.AppImage --version | head -1)" = "lineit, version $version" ]
          # Installed-like: modules, runtime and Compile from inside it, the
          # user's files in a home of its own
          export HOME=$RUNNER_TEMP/home XDG_CONFIG_HOME= XDG_DATA_HOME= XDG_CACHE_HOME=
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/lineit-x86_64.AppImage" --compile "$GITHUB_WORKSPACE/examples/hello.lua"
          [ "$("$HOME/.local/share/lineit/bin/hello")" = "Hello, world!" ]

      # The source tarball builds on its own, and is the same bytes built
      # again from scratch, elsewhere, later and with another umask
      - name: Check the tarball
        run: |
          version=$(make -s version)
          tar -xzf "lineit-$version.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lineit-$version"
          again=$RUNNER_TEMP/again
          cp -a . "$again"
          rm -rf "$again/build" "$again"/*.tar.gz
          chmod -R go-rwx "$again"
          sleep 1
          make -C "$again" dist
          cmp "lineit-$version.tar.gz" "$again/lineit-$version.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-package
          path: |
            lineit-*.tar.gz
            lineit-*.AppImage
          if-no-files-found: error

  # scripts/install.sh on what package made, served as a release from a dir:
  # a broken install.sh fails here, before it's published
  install-check:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: ${{ github.repository }}
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-package
          path: ${{ runner.temp }}/github/${{ github.repository }}/releases/download/ci

      # GITHUB is where install.sh looks for releases. No attestation:
      # nothing's published yet.
      - name: Install, reinstall, uninstall
        run: |
          export GITHUB=file://$RUNNER_TEMP/github HOME=$RUNNER_TEMP/home
          (cd "$RUNNER_TEMP/github/$REPO/releases/download/ci" && sha256sum -- * >SHA256SUMS)
          version=$(make -s version)
          bash scripts/install.sh --yes --skip-attestation ci
          [ "$("$HOME/.local/bin/lineit" --version | head -1)" = "lineit, version $version" ]
          test -f "$HOME/.local/share/applications/lineit.desktop"
          bash scripts/install.sh --yes --skip-attestation ci
          bash scripts/install.sh --yes uninstall
          test ! -e "$HOME/.local/bin/lineit"
          test ! -e "$HOME/.local/share/applications/lineit.desktop"

  # One check that passes only if every other one did, for main's branch
  # protection to require, and for the release to wait for
  ok:
    if: ${{ !cancelled() }}
    needs: [test, format, analyze, docs, package, install-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ]; done

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: ok
    # One at a time: nightly's files are replaced in place
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release, and the nightly tag
      id-token: write # for the attestation
      attestations: write
    steps:
      # Its credentials stay: it pushes the nightly tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release is LI_VERSION: its tag can't say something else
      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          version=$(make -s version)
          [ "$GITHUB_REF_NAME" = "v$version" ] ||
            { echo "the tag is $GITHUB_REF_NAME, LI_VERSION in src/lineit.h is $version" >&2; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-package
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-docs
          path: docs

      # release/ is the version's release, or nightly. docs/ is the docs
      # release, from main: nightly has no docs of its own. A version's
      # release has them too, the ones of that version.
      - name: Checksums
        run: |
          # PDFs from docs/ subfolders keep their folders: flatten them
          find docs -mindepth 2 -type f -exec mv -t docs {} +
          find docs -mindepth 1 -type d -delete
          [ "$GITHUB_REF_TYPE" != tag ] || cp docs/* release/
          # The install script too, so it's attested like the rest: what the
          # README runs is releases/latest/download/install.sh
          cp scripts/install.sh release/
          for dir in release docs; do
            (cd "$dir" && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
          done

      # Proof that these files were built here, from this commit: `gh
      # attestation verify` checks SHA256SUMS, and SHA256SUMS the rest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*
            docs/*

      # Nightly is the latest release: releases/latest, what install.sh and
      # the README's link get. A version's release isn't, nor is docs.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest=false
            exit
          fi
          built="Built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC'). It changes with every push to main."

          # update TAG TITLE DIR LATEST NOTES: the release TAG, moved here,
          # with the files in DIR. They're replaced in place: deleting it and
          # making it again would leave a moment without it. SHA256SUMS goes
          # last, so a download in between finds files newer than their
          # checksums, and fails instead of using them.
          update() {
            local tag=$1 title=$2 dir=$3 latest=$4 notes=$5
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "$tag"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" "$dir"/* --repo "$GITHUB_REPOSITORY" --verify-tag \
                --title "$title" --notes "$notes" --latest="$latest"
              return
            fi
            (
              cd "$dir" || exit
              files=()
              for file in *; do [ "$file" = SHA256SUMS ] || files+=("$file"); done
              gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release upload "$tag" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
              # The files this build doesn't have, like the last one's tarball
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
                while read -r asset; do
                  [ -e "$asset" ] || gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                done
            )
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes" \
              --prerelease=false --latest="$latest"
          }
          update nightly Nightly release true "$built"
          update docs Docs docs false "The docs as PDF. $built"
