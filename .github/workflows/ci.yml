name: CI

# Every push to main and every pull request runs the tests on Linux, macOS
# and Windows, and on Linux with AddressSanitizer and ThreadSanitizer, checks
# the format, the scripts and clippy, builds the docs, and builds and checks
# what's released: an archive per OS, the AppImage, the source tarball, the
# install script and the Docker image. A push to main also refreshes the
# "nightly" release with them, and a v* tag (see scripts/release.sh) makes a
# release of its own, only if every job passes. Their files are attested
# (signed as built by this workflow). The image goes to ghcr.io, as nightly
# or as the version and latest.
#
# Everything that can runs at the same time: only `ok` waits for the rest,
# and the release and the image for `ok`. A slow step that doesn't need
# the others is a job of its own.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only: the jobs that publish ask for more
permissions:
  contents: read

# A new push to a pull request cancels the run that's testing the code it
# replaces. Pushes to main and tags never cancel anything.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # What winit and glow need to build on Linux (they load the rest at run
  # time)
  APT_PACKAGES: libx11-dev libxkbcommon-dev libgl1-mesa-dev pkg-config

jobs:
  # Every canvas in examples/ and tests/ against its .out, run, the unit
  # tests, and the command line as a user runs it, on each OS (test). Every
  # canvas compiled with cargo, and the program against its .out (compile):
  # one after another, as they share cargo's target dir, so in a job of its
  # own. On Linux, the tests again with AddressSanitizer and with
  # ThreadSanitizer (branches run on threads): they need Rust nightly, and
  # the standard library built with them. Each a job of its own, at the same
  # time.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, suite: test }
          - { os: macos-latest, suite: test }
          - { os: windows-latest, suite: test }
          - { os: ubuntu-24.04, suite: compile }
          - { os: macos-latest, suite: compile }
          - { os: windows-latest, suite: compile }
          - { os: ubuntu-24.04, suite: asan, sanitizer: address }
          - { os: ubuntu-24.04, suite: tsan, sanitizer: thread }
    name: ${{ matrix.suite }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Compiled programs' builds, where the cache below finds them
      LINEIT_HOME: ${{ github.workspace }}/.lineit-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install Rust
        shell: bash
        run: |
          if [ -z "${{ matrix.sanitizer }}" ]; then
            rustup update stable && rustup default stable
          else
            rustup toolchain install nightly --profile minimal --component rust-src && rustup default nightly
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .lineit-home/cache/target
          key: ${{ matrix.suite }}-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.suite }}-${{ matrix.os }}-

      - name: cargo test
        if: matrix.suite == 'test'
        run: cargo test --locked

      - name: Compile every canvas
        if: matrix.suite == 'compile'
        env:
          LINEIT_TEST_COMPILE: "1"
        run: cargo test --locked -p lineit-core --test canvases compiled

      # The runners randomize addresses more than the sanitizers can handle.
      # --target: the flags go to lineit, not to build scripts and macros.
      - name: cargo test (${{ matrix.sanitizer }} sanitizer)
        if: matrix.sanitizer
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          cargo test --locked -Zbuild-std --target x86_64-unknown-linux-gnu

      # The CLI as a user runs it: an example, and a package made, packed,
      # installed and used
      - name: The command line
        if: matrix.suite == 'test'
        shell: bash
        run: |
          set -eux
          # cargo test builds the binary's tests, not the binary
          cargo build --locked -p lineit
          lineit=$GITHUB_WORKSPACE/target/debug/lineit
          [ "$("$lineit" --version | tr -d '\r')" = "lineit $(scripts/version.sh)" ]
          "$lineit" run examples/hello.lua | tr -d '\r' | grep -x "Hello, world!"
          "$lineit" check examples/fizzbuzz.lua
          # code squares from the command line: their tests, and branches
          # changing the same variables at once
          "$lineit" test tests/code.lua
          "$lineit" test tests/code_python.lua
          "$lineit" run tests/parallel.lua | tr -d '\r' | grep -x "n = 200000, total = 2000"
          cd "$RUNNER_TEMP"
          "$lineit" new-package greet
          "$lineit" pack greet
          "$lineit" install greet-0.1.0.lipkg
          "$lineit" modules | grep greet/hello

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rustfmt
        run: rustup update stable && rustup default stable && rustup component add rustfmt

      - name: Check the format
        run: cargo fmt --all --check

      - name: Check the scripts
        run: shellcheck scripts/*.sh scripts/hooks/*

  # What no test runs into: clippy, every warning an error
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install clippy
        run: rustup update stable && rustup default stable && rustup component add clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: analyze-${{ hashFiles('Cargo.lock') }}
          restore-keys: analyze-

      - name: Analyze
        run: cargo clippy --locked --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: 0.15.1 # a new one could change the PDFs, or break them

      - name: Build PDFs
        run: for f in docs/*.typ; do typst compile "$f"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs/*.pdf
          if-no-files-found: error

  # What's released: an archive per OS and processor, and on Linux the
  # AppImage. Each checked before it's released, and install.sh with them.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest runner: a program needs a glibc at least as new as the
          # one it was built with, so this makes it run on more systems
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz, runs: true, install: true }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz, runs: true, install: true }
          # Built for Intel Macs on an ARM one: it doesn't run here
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz, runs: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip, runs: true }
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1 # the runners have no FUSE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: package-${{ matrix.target }}-

      - name: Build
        shell: bash
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          bash scripts/dist.sh ${{ matrix.target }} ${{ matrix.archive }} dist

      - name: AppImage
        if: runner.os == 'Linux'
        run: bash scripts/appimage.sh target/${{ matrix.target }}/release/lineit dist

      # What gets released works, before it's released: the program out of
      # its archive says its version and runs a canvas
      - name: Check the archive
        if: matrix.runs
        shell: bash
        run: |
          set -eux
          name="lineit-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z x -o"$RUNNER_TEMP" "dist/$name.zip" >/dev/null
          else
            tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          fi
          # D:\a\_temp on Windows, as bash wants it there
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null; then tmp=$(cygpath -u "$tmp"); fi
          lineit=$tmp/$name/lineit
          [ "$("$lineit" --version | tr -d '\r')" = "lineit $(scripts/version.sh)" ]
          "$lineit" run "$tmp/$name/examples/hello.lua" | tr -d '\r' | grep -x "Hello, world!"

      # Installed-like: Compile from inside it, the user's files in a home of
      # its own (cargo and rustup stay where they are)
      - name: Check the AppImage
        if: runner.os == 'Linux'
        run: |
          set -eux
          app=$GITHUB_WORKSPACE/dist/lineit-x86_64.AppImage
          [ "$("$app" --version)" = "lineit $(scripts/version.sh)" ]
          export CARGO_HOME=${CARGO_HOME:-$HOME/.cargo} RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}
          export HOME=$RUNNER_TEMP/home XDG_CONFIG_HOME='' XDG_DATA_HOME='' XDG_CACHE_HOME=''
          mkdir -p "$HOME"
          cd "$RUNNER_TEMP"
          "$app" compile "$GITHUB_WORKSPACE/examples/hello.lua" -o "$RUNNER_TEMP/hello"
          [ "$("$RUNNER_TEMP/hello")" = "Hello, world!" ]

      # scripts/install.sh on what this job made, served as a release from a
      # dir: a broken install.sh fails here, before it's published. GITHUB is
      # where install.sh looks for releases. No attestation: nothing's
      # published yet. /bin/bash: on macOS, its own, 3.2.
      - name: Check install.sh
        if: matrix.install
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eux
          version=$(scripts/version.sh)
          release=$RUNNER_TEMP/github/$REPO/releases/download/ci
          mkdir -p "$release"
          cp dist/lineit-${{ matrix.target }}.tar.gz "$release/"
          (cd "$release" && shasum -a 256 -- * >SHA256SUMS)
          export GITHUB=file://$RUNNER_TEMP/github HOME=$RUNNER_TEMP/install-home
          /bin/bash scripts/install.sh --yes --skip-attestation ci
          [ "$("$HOME/.local/bin/lineit" --version)" = "lineit $version" ]
          "$HOME/.local/bin/lineit" run "$HOME/.local/share/lineit/examples/hello.lua" | grep -x "Hello, world!"
          if [ "$RUNNER_OS" = Linux ]; then test -f "$HOME/.local/share/applications/lineit.desktop"; fi
          /bin/bash scripts/install.sh --yes --skip-attestation ci
          /bin/bash scripts/install.sh --yes uninstall
          test ! -e "$HOME/.local/bin/lineit"
          test ! -e "$HOME/.local/share/lineit"
          test ! -e "$HOME/.local/share/applications/lineit.desktop"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The source as of this commit, released as lineit-VERSION.tar.gz. It
  # builds on its own, and is the same bytes made again, elsewhere and with
  # another umask.
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Source tarball
        run: |
          set -eux
          version=$(scripts/version.sh)
          mkdir dist
          git archive --format=tar.gz --prefix="lineit-$version/" -o "dist/lineit-$version.tar.gz" HEAD
          again=$RUNNER_TEMP/again
          git clone -q --no-local . "$again"
          (cd "$again" && umask 077 && git archive --format=tar.gz --prefix="lineit-$version/" -o again.tar.gz HEAD)
          cmp "dist/lineit-$version.tar.gz" "$again/again.tar.gz"

      - name: Build it
        run: |
          version=$(scripts/version.sh)
          tar -xzf "dist/lineit-$version.tar.gz" -C "$RUNNER_TEMP"
          cargo build --locked --manifest-path "$RUNNER_TEMP/lineit-$version/Cargo.toml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-source
          path: dist/*
          if-no-files-found: error

  # The Docker image (see the Dockerfile): built, run on a folder like the
  # README's -v, and checked. Saved for docker-publish, which pushes it if
  # every job passes.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build -t lineit:ci \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$(scripts/version.sh)" .

      # noVNC's page answers, and through it the VNC server; lineit runs
      # and keeps running; Compile works, as the folder's owner, and what
      # it makes is in the folder, theirs
      - name: Check the image
        run: |
          work=$RUNNER_TEMP/work
          mkdir "$work"
          docker run -d --name lineit -p 127.0.0.1:6080:6080 -v "$work":/work lineit:ci
          for _ in $(seq 30); do curl -fsS http://localhost:6080/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:6080/vnc.html | grep -q noVNC
          python3 -I - <<'EOF'
          import base64, os, socket
          s = socket.create_connection(("localhost", 6080), timeout=10)
          key = base64.b64encode(os.urandom(16)).decode()
          s.sendall(("GET /websockify HTTP/1.1\r\nHost: localhost:6080\r\nUpgrade: websocket\r\n"
                     f"Connection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n"
                     "Sec-WebSocket-Protocol: binary\r\n\r\n").encode())
          data = b""
          while b"\r\n\r\n" not in data:
              data += s.recv(4096)
          head, data = data.split(b"\r\n\r\n", 1)
          assert head.startswith(b"HTTP/1.1 101"), head
          while len(data) < 14:
              data += s.recv(4096)
          assert data[2:14] == b"RFB 003.008\n", data  # the VNC server's hello, in a websocket frame
          EOF
          # No ps in the image
          lineit_pid() { docker exec lineit sh -c 'grep -lsx lineit /proc/[0-9]*/comm'; }
          first=$(lineit_pid)
          sleep 5
          [ -n "$first" ] && [ "$(lineit_pid)" = "$first" ]
          docker exec -u "$(id -u)" lineit lineit compile /usr/share/lineit/examples/hello.lua -o /work/hello
          [ "$(docker exec lineit /work/hello)" = "Hello, world!" ]
          [ "$(stat -c %u "$work/hello")" = "$(id -u)" ]
          docker stop lineit

      - name: Logs
        if: failure()
        run: docker logs lineit

      - name: Save
        run: docker save lineit:ci | gzip >lineit-image.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: lineit-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  # One check that passes only if every other one did, for main's branch
  # protection to require, and for the release to wait for
  ok:
    if: ${{ !cancelled() }}
    needs: [test, format, analyze, docs, package, source, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ]; done

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: ok
    # One at a time: nightly's files are replaced in place
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release, and the nightly tag
      id-token: write # for the attestation
      attestations: write
    steps:
      # Its credentials stay: it pushes the nightly tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release is the version in Cargo.toml: its tag can't say something
      # else
      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          version=$(scripts/version.sh)
          [ "$GITHUB_REF_NAME" = "v$version" ] ||
            { echo "the tag is $GITHUB_REF_NAME, the version in Cargo.toml is $version" >&2; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: docs-pdf

      # release/ is the version's release, or nightly. docs-pdf/ is the docs
      # release, from main: nightly has no docs of its own. A version's
      # release has them too, the ones of that version.
      - name: Checksums
        run: |
          [ "$GITHUB_REF_TYPE" != tag ] || cp docs-pdf/* release/
          # The install script too, so it's attested like the rest: what the
          # README runs is releases/latest/download/install.sh
          cp scripts/install.sh release/
          for dir in release docs-pdf; do
            (cd "$dir" && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
          done

      # Proof that these files were built here, from this commit: `gh
      # attestation verify` checks SHA256SUMS, and SHA256SUMS the rest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*
            docs-pdf/*

      # Nightly is the latest release: releases/latest, what install.sh and
      # the README's links get. A version's release isn't, nor is docs.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest=false
            exit
          fi
          built="Built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC'). It changes with every push to main."

          # update TAG TITLE DIR LATEST NOTES: the release TAG, moved here,
          # with the files in DIR. They're replaced in place: deleting it and
          # making it again would leave a moment without it. SHA256SUMS goes
          # last, so a download in between finds files newer than their
          # checksums, and fails instead of using them.
          update() {
            local tag=$1 title=$2 dir=$3 latest=$4 notes=$5
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "$tag"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" "$dir"/* --repo "$GITHUB_REPOSITORY" --verify-tag \
                --title "$title" --notes "$notes" --latest="$latest"
              return
            fi
            (
              cd "$dir" || exit
              files=()
              for file in *; do [ "$file" = SHA256SUMS ] || files+=("$file"); done
              gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release upload "$tag" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
              # The files this build doesn't have, like the last one's tarball
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
                while read -r asset; do
                  [ -e "$asset" ] || gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                done
            )
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes" \
              --prerelease=false --latest="$latest"
          }
          update nightly Nightly release true "$built"
          update docs Docs docs-pdf false "The docs as PDF. $built"

  # The image the docker job checked, to ghcr.io/OWNER/lineit: nightly from
  # main, vX.Y.Z and latest from a tag (only a tag that is the version in
  # Cargo.toml, as the release). At the same time as the release.
  docker-publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: ok
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          version=$(scripts/version.sh)
          [ "$GITHUB_REF_NAME" = "v$version" ] ||
            { echo "the tag is $GITHUB_REF_NAME, the version in Cargo.toml is $version" >&2; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image

      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags="$GITHUB_REF_NAME latest"; else tags=nightly; fi
          gunzip -c lineit-image.tar.gz | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in $tags; do
            docker tag lineit:ci "$image:$tag"
            docker push "$image:$tag"
          done
