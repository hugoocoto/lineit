# Not inheriting from the workspace on purpose: lineit writes this crate out
# next to every program it compiles, where there's no workspace.
[package]
name = "lineit-rt"
version = "0.1.0"
edition = "2024"
# compiled programs build it with the Rust of the machine they compile on
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "The runtime of lineit: what its interpreter and its compiled programs share"
repository = "https://github.com/hugoocoto/lineit"

[features]
default = []
image = ["dep:image"]
lua = ["dep:mlua"]
# code squares in languages run by their own interpreter (Python...)
process = ["dep:serde_json", "dep:fs4"]
shader = ["dep:tree-sitter", "dep:tree-sitter-gdshader", "dep:libm"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "qoi", "tga"], optional = true }
mlua = { version = "0.12", features = ["lua54", "vendored", "send"], optional = true }
# the shader parser (tree-sitter 0.26 and up ask for a newer Rust than this crate promises)
tree-sitter = { version = "0.25", optional = true }
tree-sitter-gdshader = { version = "0.4", optional = true }
# the messages to and from those interpreters, as JSON lines
serde_json = { version = "1", optional = true }
# locks on files: code that is built when it starts (C#) is started by one at a time
fs4 = { version = "1", optional = true }
# sin, pow...: the same bits on every machine, as the tests compare outputs
libm = { version = "0.2", optional = true }

[lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"
