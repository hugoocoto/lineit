[package]
name = "lineit-core"
description = "lineit without the GUI: canvases, modules, types, the IR, the interpreter and the compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libloading = "0.8"
lineit-rt = { path = "../lineit-rt", features = ["image", "lua", "process", "shader"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }
# reads the signature of the function in a code square
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
# grammars of languages from files, loaded from their libraries
tree-sitter-language = "0.1"
tree-sitter-lua = "0.5"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-rust = "0.24"
quick-xml = "0.41"
fs4 = "1"
# what a code square in Python (or another process) is given to load
serde_json = "1"
# the line diffs of code squares and notes
similar = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }


[lints]
workspace = true
